[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clip-watcher"
version = "0.1.0"
description = "Clipboard watcher and text workflow automation tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow",
    "pywin32",
    "psutil",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "ruff",
    "pytest",
    "pytest-mock",
]

# --- Pytest ---
[tool.pytest.ini_options]
pythonpath = "."

# --- Mypy ---
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_context = true
show_column_numbers = true
pretty = true
exclude = ["venv", "migrations", "tests"]

# --- Ruff ---
[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N"]
ignore = [
    "E501",  # 行の長さ違反
    "B008",  # 関数呼び出しをデフォルト引数にすることを許可
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
