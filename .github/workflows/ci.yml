name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

# 同じブランチ・PR に新しい push があったら、古い実行を取り消す。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # macOS は初めて CI で実行するため、当面は失敗してもワークフロー全体を失敗にしない。
    # 安定したことを確認できたら、この行を削除して必須チェックにする（Issue #223）。
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    # テストがハングしても、既定の6時間待たずに打ち切る（通常は1分程度で終わる）。
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run Ruff (Linter)
        run: |
          uv run ruff check .

      - name: Run Ruff (Formatter Check)
        run: |
          uv run ruff format --check .

      - name: Run Mypy (Type Check)
        run: |
          uv run mypy .

      - name: Run Pytest
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a uv run pytest --cov --cov-report=term -o faulthandler_timeout=120
          else
            uv run pytest --cov --cov-report=term -o faulthandler_timeout=120
          fi

      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Coverage (${RUNNER_OS})"
            echo
            uv run coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY" || true
